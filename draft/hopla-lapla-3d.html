<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hopla · Lapla 3D</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#050507;overflow:hidden;cursor:grab}
body:active{cursor:grabbing}
#stage{position:fixed;inset:0;margin:0;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:clamp(9px,.8vw,13px);line-height:1;white-space:pre;user-select:none;color:#ddd}
#probe{position:absolute;visibility:hidden;line-height:1}
</style>
</head>
<body>
<pre id="stage"></pre>
<span id="probe"></span>
<script>
'use strict';
const stage = document.getElementById('stage'), probe = document.getElementById('probe');
let COLS = 0, ROWS = 0, cellW = 7, cellH = 13;
function resize() {
  const cs = getComputedStyle(stage);
  probe.style.fontSize = cs.fontSize; probe.style.fontFamily = cs.fontFamily;
  probe.textContent = 'M'.repeat(20);
  const r = probe.getBoundingClientRect();
  cellW = r.width / 20; cellH = r.height;
  COLS = Math.floor(innerWidth / cellW); ROWS = Math.floor(innerHeight / cellH);
}
addEventListener('resize', resize);

// ---------- state ----------
let T = 0, yaw = 0.6, yawV = 0.7, zoom = 1;
const J = { y: 0, vy: 0, sq: 1, sqv: 0, air: false, spinLeft: 0 };
const E = { twitch: 0, twitchV: 0 };
let hypno = 0, hypnoTarget = 0, electric = 0, sleeping = false, lastActive = 0, typed = '';
let bubble = null;
const parts = [];

// ---------- SDF helpers ----------
const sqrt = Math.sqrt;
function ell(x, y, z, a, b, c) {
  const X = x / a, Y = y / b, Z = z / c, k0 = sqrt(X * X + Y * Y + Z * Z);
  const X2 = x / (a * a), Y2 = y / (b * b), Z2 = z / (c * c), k1 = sqrt(X2 * X2 + Y2 * Y2 + Z2 * Z2);
  return k1 === 0 ? -Math.min(a, b, c) : k0 * (k0 - 1) / k1;
}
const sph = (x, y, z, r) => sqrt(x * x + y * y + z * z) - r;
function smin(a, b, k) { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; }

// per-frame transform, precomputed once
let cy = 1, sy = 0, sqy = 1, sqs = 1, droop = 0.25, dc = 1, ds = 0;
const earCos = [1, 1], earSin = [0, 0];
function prep() {
  cy = Math.cos(yaw); sy = Math.sin(yaw); sqy = J.sq; sqs = sqrt(J.sq);
  droop = sleeping ? 1.05 : 0.22 - J.vy * 0.05; dc = Math.cos(droop); ds = Math.sin(droop);
  [-1, 1].forEach((side, i) => { const a = -side * 0.22 + E.twitch * side; earCos[i] = Math.cos(a); earSin[i] = Math.sin(a); });
}
function toLocal(x, y, z) {
  y -= J.y;
  return [(cy * x - sy * z) * sqs, y / sqy, (sy * x + cy * z) * sqs];
}
function earD(lx, ly, lz, i) {
  const side = i ? 1 : -1, px = lx - side * 0.13, py = ly - 1.36, pz = lz - 0.2;
  const rx = earCos[i] * px + earSin[i] * py, ry = -earSin[i] * px + earCos[i] * py;
  const ry2 = dc * ry - ds * pz, rz = ds * ry + dc * pz;
  return [ell(rx, ry2 - 0.38, rz, 0.095, 0.4, 0.06), rx, rz];
}
function map(x, y, z) {
  const [lx, ly, lz] = toLocal(x, y, z);
  let d = ell(lx, ly - 0.55, lz, 0.55, 0.5, 0.62);
  d = smin(d, ell(lx, ly - 1.12, lz - 0.3, 0.37, 0.33, 0.35), 0.14);
  d = smin(d, ell(lx - 0.25, ly - 0.09, lz - 0.32, 0.14, 0.08, 0.24), 0.06);
  d = smin(d, ell(lx + 0.25, ly - 0.09, lz - 0.32, 0.14, 0.08, 0.24), 0.06);
  d = smin(d, sph(lx, ly - 0.62, lz + 0.6, 0.17), 0.05);
  d = smin(d, earD(lx, ly, lz, 0)[0], 0.06);
  d = smin(d, earD(lx, ly, lz, 1)[0], 0.06);
  d = Math.min(d, sph(lx - 0.155, ly - 1.17, lz - 0.575, 0.085), sph(lx + 0.155, ly - 1.17, lz - 0.575, 0.085), sph(lx, ly - 1.06, lz - 0.66, 0.045));
  return d * Math.min(sqy, 1 / sqs) * 0.95;
}
function material(x, y, z) {
  const [lx, ly, lz] = toLocal(x, y, z);
  for (const side of [-1, 1]) {
    const qx = lx - side * 0.155, qy = ly - 1.17, qz = lz - 0.575;
    if (sqrt(qx * qx + qy * qy + qz * qz) < 0.1) return { m: 'eye', qx, qy, side };
  }
  if (sph(lx, ly - 1.06, lz - 0.66, 0.06) < 0) return { m: 'nose' };
  for (const i of [0, 1]) { const [d, rx, rz] = earD(lx, ly, lz, i); if (d < 0.02 && rz > 0.015 && Math.abs(rx) < 0.06) return { m: 'inner' }; }
  if (sph(lx, ly - 0.62, lz + 0.6, 0.2) < 0) return { m: 'tail' };
  return { m: 'fur' };
}

// ---------- colour + chars ----------
const RAMP = ' .,:;-=+*#%@';
const q24 = v => Math.max(0, Math.min(255, Math.round(v / 20) * 20));
const rgb = (r, g, b) => `rgb(${q24(r)},${q24(g)},${q24(b)})`;
function hsl(h, s, l) {
  h = ((h % 360) + 360) % 360 / 360;
  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0) * 255, f(8) * 255, f(4) * 255];
}

// ---------- render ----------
function render() {
  prep();
  const cells = new Array(COLS * ROWS);
  const hit = new Uint8Array(COLS * ROWS);
  const camZ = 3.6 / zoom, camY = 1.0, F = 0.62;
  const bcY = 1.0 * J.sq + J.y, bR = 1.55 * Math.max(1, J.sq);
  const lA = T * 0.9, Lx = Math.cos(lA) * 0.7, Ly = 0.75, Lz = 0.55 + Math.sin(lA) * 0.3;
  const Ln = sqrt(Lx * Lx + Ly * Ly + Lz * Lz), lx0 = Lx / Ln, ly0 = Ly / Ln, lz0 = Lz / Ln;
  const hueBase = T * 40;
  // eye centre on screen, for the hypnotic spiral in the background
  const head = project(0, 1.2 + J.y, 0, camZ, camY, F);
  for (let r = 0; r < ROWS; r++) {
    const v = -(r - ROWS / 2) / (ROWS / 2);
    for (let c = 0; c < COLS; c++) {
      const u = (c - COLS / 2) * cellW / (ROWS * cellH / 2);
      let dx = u * F, dy = v * F, dz = -1;
      const dn = sqrt(dx * dx + dy * dy + 1); dx /= dn; dy /= dn; dz /= dn;
      const ox = 0, oy = camY, oz = camZ;
      // bounding sphere
      const cxo = ox, cyo = oy - bcY, czo = oz;
      const bq = cxo * dx + cyo * dy + czo * dz, cc = cxo * cxo + cyo * cyo + czo * czo - bR * bR, disc = bq * bq - cc;
      let t = -1;
      if (disc > 0) {
        let tt = Math.max(0, -bq - sqrt(disc)); const tEnd = -bq + sqrt(disc);
        for (let i = 0; i < 64 && tt < tEnd; i++) {
          const d = map(ox + dx * tt, oy + dy * tt, oz + dz * tt);
          if (d < 0.003) { t = tt; break; }
          tt += d;
        }
      }
      const idx = r * COLS + c;
      if (t > 0) {
        hit[idx] = 1;
        const px = ox + dx * t, py = oy + dy * t, pz = oz + dz * t, e = 0.002;
        let nx = map(px + e, py - e, pz - e) * 1 + map(px - e, py - e, pz + e) * -1 + map(px - e, py + e, pz - e) * -1 + map(px + e, py + e, pz + e);
        let ny = map(px + e, py - e, pz - e) * -1 + map(px - e, py - e, pz + e) * -1 + map(px - e, py + e, pz - e) + map(px + e, py + e, pz + e);
        let nz = map(px + e, py - e, pz - e) * -1 + map(px - e, py - e, pz + e) + map(px - e, py + e, pz - e) * -1 + map(px + e, py + e, pz + e);
        const nn = sqrt(nx * nx + ny * ny + nz * nz) || 1; nx /= nn; ny /= nn; nz /= nn;
        const diff = Math.max(0, nx * lx0 + ny * ly0 + nz * lz0);
        const rim = Math.pow(1 - Math.max(0, -(nx * dx + ny * dy + nz * dz)), 2.4);
        const mt = material(px, py, pz);
        let ch, col;
        if (mt.m === 'eye') {
          if (sleeping) { ch = '─'; col = rgb(90, 80, 110); }
          else {
            const ang = Math.atan2(mt.qy, mt.qx * mt.side), rad = sqrt(mt.qx * mt.qx + mt.qy * mt.qy) / 0.085;
            const speed = 7 + hypno * 14, bands = 2 + Math.round(hypno);
            const s = Math.sin(ang * bands + rad * (12 + hypno * 10) - T * speed);
            if (rad < 0.18) { ch = '●'; col = '#ffffff'; }
            else if (s > 0) { ch = '@'; const [R, G, B] = hsl(300 + hypno * (T * 120), 1, 0.6); col = rgb(R, G, B); }
            else { ch = '·'; const [R, G, B] = hsl(180 + hypno * (T * 120), 1, 0.55); col = rgb(R, G, B); }
          }
        } else {
          const I = Math.min(1, 0.1 + 0.72 * diff + 0.45 * rim);
          ch = RAMP[Math.max(1, Math.min(RAMP.length - 1, Math.floor(I * RAMP.length)))];
          let base = mt.m === 'inner' || mt.m === 'nose' ? [255, 130, 175] : mt.m === 'tail' ? [255, 255, 255] : [236, 232, 255];
          const [er, eg, eb] = hsl(hueBase + ny * 90 + electric * 200, 1, 0.55);
          const k = 0.25 + 0.75 * diff, rk = rim * (0.9 + electric);
          col = rgb(base[0] * k + er * rk, base[1] * k + eg * rk, base[2] * k + eb * rk);
          if (electric > 0 && Math.random() < electric * 0.05) { ch = '▓'; col = '#ffffff'; }
        }
        cells[idx] = [ch, col];
        continue;
      }
      // floor: synthwave grid scrolling under him
      if (dy < -0.02) {
        const tf = -oy / dy, fx = ox + dx * tf, fz = oz + dz * tf;
        if (tf < 14 && Math.abs(fx) < 7) {
          const gz = fz + T * 1.2, fr = a => a - Math.floor(a);
          const lxg = fr(fx * 1.2) < 0.08, lzg = fr(gz * 1.2) < 0.08;
          const fade = Math.max(0, 1 - tf / 14);
          const shadow = sqrt(fx * fx + fz * fz) < 0.75 / (1 + J.y * 1.5);
          if (shadow) { cells[idx] = ['░', rgb(40, 20, 60)]; continue; }
          if (lxg || lzg) {
            const [R, G, B] = hsl(310 + fz * 8 + hypno * T * 60, 1, 0.35 + 0.3 * fade);
            cells[idx] = [lxg && lzg ? '┼' : lxg ? '│' : '─', rgb(R * fade, G * fade, B * fade)];
            continue;
          }
          cells[idx] = null; continue;
        }
      }
      // sky: slow plasma, which turns into a hypnotic spiral centred on the eyes
      const sxp = (c - head[0]) * cellW / cellH, syp = r - head[1];
      const dist = sqrt(sxp * sxp + syp * syp), ang = Math.atan2(syp, sxp);
      const plasma = Math.sin(c * 0.08 + T) + Math.sin(r * 0.14 - T * 1.3) + Math.sin((c + r) * 0.05 + T * 0.7);
      const spiral = Math.sin(ang * 4 + dist * 0.45 - T * (3 + hypno * 6));
      const val = (1 - hypno) * (plasma / 3) * 0.35 + hypno * spiral;
      if (val > 0.25) {
        const [R, G, B] = hsl(hueBase + dist * 3 + plasma * 30, 0.9, 0.12 + 0.28 * hypno + 0.1 * val);
        cells[idx] = [hypno > 0.5 ? (val > 0.7 ? '▒' : '░') : (val > 0.3 ? '·' : '.'), rgb(R, G, B)];
      } else cells[idx] = null;
    }
  }
  // RGB split on the silhouette edges
  for (let r = 0; r < ROWS; r++) for (let c = 1; c < COLS - 1; c++) {
    const i = r * COLS + c;
    if (hit[i] && !hit[i - 1]) cells[i - 1] = [cells[i][0], '#ff2d6f'];
    if (hit[i] && !hit[i + 1]) { cells[i + 1] = [cells[i][0], '#2de1ff']; c++; }
  }
  return { cells, head };
}
function project(x, y, z, camZ, camY, F) {
  const dx = x, dy = y - camY, dz = z - camZ;
  const u = dx / -dz / F, v = dy / -dz / F;
  return [u * (ROWS * cellH / 2) / cellW + COLS / 2, -v * ROWS / 2 + ROWS / 2];
}

function put(cells, text, col, row, color) {
  [...text].forEach((ch, i) => {
    const c = Math.round(col) + i, r = Math.round(row);
    if (r >= 0 && r < ROWS && c >= 0 && c < COLS) cells[r * COLS + c] = [ch, color];
  });
}
function bolts(cells, head) {
  const n = Math.ceil(electric * 5);
  for (let b = 0; b < n; b++) {
    let x = head[0] + (Math.random() - 0.5) * 30, y = head[1] + (Math.random() - 0.5) * 16;
    const dir = Math.random() < 0.5 ? -1 : 1;
    for (let s = 0; s < 14; s++) {
      const step = Math.random();
      const ch = step < 0.33 ? '╱' : step < 0.66 ? '╲' : '│';
      put(cells, ch, x, y, Math.random() < 0.5 ? '#ffffff' : '#7df9ff');
      x += dir * (ch === '│' ? 0 : ch === '╱' ? 1 : -1) + (Math.random() - 0.5) * 2; y += 1;
    }
  }
}
function overlay(cells, head) {
  if (electric > 0) bolts(cells, head);
  for (const p of parts) put(cells, p.ch, p.x, p.y, p.color);
  if (bubble && T < bubble.until) {
    const w = [...bubble.text].length + 2, col = head[0] + 8, row = head[1] - 9;
    put(cells, '╭' + '─'.repeat(w) + '╮', col, row, '#e8e8ff');
    put(cells, '│ ' + bubble.text + ' │', col, row + 1, bubble.color || '#3ddc97');
    put(cells, '╰┬' + '─'.repeat(w - 1) + '╯', col, row + 2, '#e8e8ff');
    put(cells, '╯', col, row + 3, '#e8e8ff');
  }
  put(cells, 'hopla', 2, 1, '#3ddc97');
  put(cells, `· Lapla 3D${hypno > 0.5 ? ' · hypnose' : ''}${sleeping ? ' · dodo' : ''}`, 8, 1, '#8a8aa0');
  put(cells, 'glisse : fais-le tourner · clic : saute · espace : hypnose · e : électrochoc · tape « hopla » · molette : zoom', 2, ROWS - 2, '#55556a');
}
function toHtml(cells) {
  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  let out = '';
  for (let r = 0; r < ROWS; r++) {
    let cur = null, buf = '';
    for (let c = 0; c < COLS; c++) {
      const cell = cells[r * COLS + c], ch = cell ? cell[0] : ' ', col = cell ? cell[1] : null;
      if (col !== cur) { if (buf) out += cur ? `<span style="color:${cur}">${esc(buf)}</span>` : buf; cur = col; buf = ''; }
      buf += ch;
    }
    out += (cur ? `<span style="color:${cur}">${esc(buf)}</span>` : buf) + '\n';
  }
  return out;
}

// ---------- behaviour ----------
function say(text, dur = 1.2, color) { bubble = { text, until: T + dur, color }; }
function jump(power = 1, spin = false) {
  if (J.air) return;
  J.vy = 4.4 * power; J.air = true; J.sq = 1.35; J.sqv = 0;
  if (spin) J.spinLeft = Math.PI * 2;
}
function confetti(n) {
  const head = project(0, 1.2 + J.y, 0, 3.6 / zoom, 1.0, 0.62);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 10 + Math.random() * 25;
    parts.push({ x: head[0], y: head[1], vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.5 - 8, life: 1.2 + Math.random(), ch: '✦*+•·'[i % 5], color: ['#ffd166', '#3ddc97', '#a78bfa', '#f472b6', '#5ccfe6'][i % 5] });
  }
}
function wake() {
  lastActive = T;
  if (sleeping) { sleeping = false; say('hein ?! je dormais pas', 1.4, '#ffd166'); jump(0.8); }
}
function update(dt) {
  if (!sleeping && T - lastActive > 10) { sleeping = true; say('z z z', 2, '#5ccfe6'); }
  hypno += (hypnoTarget - hypno) * Math.min(1, dt * 3);
  electric = Math.max(0, electric - dt * 0.8);
  if (J.air) {
    J.vy -= 9.8 * dt; J.y += J.vy * dt;
    if (J.spinLeft > 0) { const s = Math.min(J.spinLeft, dt * 9); yaw += s; J.spinLeft -= s; }
    if (J.y <= 0) { J.y = 0; J.vy = 0; J.air = false; J.sq = 0.6; J.sqv = 0; }
  } else if (!sleeping && Math.random() < dt * 0.35) jump(0.45);
  J.sqv += ((1 - J.sq) * 260 - J.sqv * 13) * dt; J.sq += J.sqv * dt;
  E.twitchV += ((0 - E.twitch) * 180 - E.twitchV * 8) * dt; E.twitch += E.twitchV * dt;
  if (!drag.on) { yaw += yawV * dt; yawV += ((sleeping ? 0.15 : 0.7) - yawV) * dt * 0.8; }
  for (const p of parts) { p.vy += 25 * dt; p.x += p.vx * dt; p.y += p.vy * dt * 0.5; p.life -= dt; }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
  if (sleeping && Math.random() < dt * 1.1) {
    const head = project(0, 1.5, 0, 3.6 / zoom, 1.0, 0.62);
    parts.push({ x: head[0] + 4, y: head[1] - 4, vx: 3, vy: -6, life: 2.5, ch: Math.random() < 0.5 ? 'z' : 'Z', color: '#5ccfe6' });
  }
}

const drag = { on: false, x: 0, moved: 0 };
addEventListener('mousedown', e => { wake(); drag.on = true; drag.x = e.clientX; drag.moved = 0; });
addEventListener('mousemove', e => {
  if (drag.on) { const d = (e.clientX - drag.x) / innerWidth * 6; yaw += d; yawV = d * 60; drag.x = e.clientX; drag.moved += Math.abs(d); }
  if (sleeping && T - lastActive > 10.5) wake(); else lastActive = T;
});
addEventListener('mouseup', () => {
  if (drag.on && drag.moved < 0.02) { jump(1); say(['hopla !', 'hop !', 'boing !'][Math.floor(Math.random() * 3)], 0.9); }
  drag.on = false;
});
addEventListener('wheel', e => { zoom = Math.max(0.6, Math.min(1.8, zoom * (e.deltaY > 0 ? 0.94 : 1.06))); lastActive = T; }, { passive: true });
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) return;
  wake();
  if (e.key === ' ') {
    hypnoTarget = hypnoTarget ? 0 : 1;
    say(hypnoTarget ? 'tu as sommeil… très sommeil…' : 'oh, où suis-je ?', 1.6, hypnoTarget ? '#f472b6' : '#3ddc97');
    e.preventDefault(); return;
  }
  if (e.key === 'e') { electric = 1.6; jump(0.9); say('BZZZT !', 1, '#7df9ff'); return; }
  E.twitch = (Math.random() - 0.5) * 0.7; E.twitchV = 0;
  if (e.key.length === 1) {
    const head = project(0, 1.9 + J.y, 0, 3.6 / zoom, 1.0, 0.62);
    parts.push({ x: head[0] + (Math.random() - 0.5) * 6, y: head[1], vx: (Math.random() - 0.5) * 8, vy: -14, life: 1.2, ch: e.key, color: '#a78bfa' });
    typed = (typed + e.key.toLowerCase()).slice(-5);
    if (typed === 'hopla') { jump(1.5, true); electric = 1.2; confetti(60); say('HOPLA !!!', 1.6, '#ffd166'); typed = ''; }
  }
});

resize();
let last = performance.now(), lastDraw = 0;
say('salut, moi c\'est Lapla', 2.2);
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  update(dt);
  if (now - lastDraw > 33) {
    const { cells, head } = render();
    overlay(cells, head);
    stage.innerHTML = toHtml(cells);
    lastDraw = now;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
