<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hopla · Lapla</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#07090a;color:#d6e4dc;overflow:hidden;cursor:crosshair}
#stage{position:fixed;inset:0;margin:0;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:clamp(8px,.72vw,12px);line-height:1;white-space:pre;user-select:none}
#probe{position:absolute;visibility:hidden;font:inherit;line-height:1}
</style>
</head>
<body>
<pre id="stage"></pre>
<span id="probe"></span>
<script>
'use strict';
const stage = document.getElementById('stage');
const probe = document.getElementById('probe');
const SX = 2, SY = 4;
const RAMP = " .'`^\",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
const cv = document.createElement('canvas');
const ctx = cv.getContext('2d', { willReadFrequently: true });
let COLS = 0, ROWS = 0, cellW = 7, cellH = 12;

function resize() {
  probe.style.fontSize = getComputedStyle(stage).fontSize;
  probe.style.fontFamily = getComputedStyle(stage).fontFamily;
  probe.textContent = 'M'.repeat(20);
  const r = probe.getBoundingClientRect();
  cellW = r.width / 20; cellH = r.height;
  COLS = Math.floor(innerWidth / cellW);
  ROWS = Math.floor(innerHeight / cellH);
  cv.width = COLS * SX; cv.height = ROWS * SY;
}
addEventListener('resize', resize);

// World in canvas pixels; the bunny's feet sit on the ground line.
const W = () => cv.width, Hc = () => cv.height;
const groundY = () => Hc() - 7 * SY;
const scale = () => Hc() / 62;

const B = { x: 0, vx: 0, y: 0, vy: 0, sq: 1, sqv: 0, dir: 1, ear: 0, earV: 0, spin: 0, spinV: 0, sleeping: false, lastActive: 0, blinkAt: 2, nextHop: 3, airborne: false };
const mouse = { x: 0, y: 0 };
const keys = [];
const parts = [];
let bubble = null, caught = 0, typed = '', t = 0, started = false;

function say(text, dur = 1.2) { bubble = { text, until: t + dur }; }
function wake() {
  B.lastActive = t;
  if (B.sleeping) { B.sleeping = false; say('!', 0.7); jump(B.x, 0.8); }
}
function jump(toX, power = 1, spin = false) {
  if (B.airborne) return;
  const k = scale();
  const air = 0.62 * Math.sqrt(power);
  B.vy = 34 * k * power; B.vx = (toX - B.x) / air;
  B.vx = Math.max(-120 * k, Math.min(120 * k, B.vx));
  B.airborne = true; B.sq = 1.3; B.sqv = 0;
  if (spin) B.spinV = Math.PI * 2 / air;
}
function burst(x, y, n, chars, colors) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 6 + Math.random() * 18;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 12, life: 1 + Math.random() * 0.8, ch: chars[i % chars.length], color: colors[i % colors.length] });
  }
}

function update(dt) {
  const k = scale(), gY = groundY();
  if (!B.sleeping && t - B.lastActive > 8) { B.sleeping = true; say('z z z', 1.5); }
  B.dir = mouse.x * SX / cellW > B.x ? 1 : -1;
  if (B.airborne) {
    B.vy -= 90 * k * dt; B.y += B.vy * dt; B.x += B.vx * dt;
    B.spin += B.spinV * dt;
    if (B.y <= 0) {
      B.y = 0; B.vy = 0; B.vx = 0; B.airborne = false; B.sq = 0.62; B.sqv = 0; B.spin = 0; B.spinV = 0;
      burst(B.x / SX, (gY) / SY, 6, ['.', '·', "'", ','], ['#8a7f6a']);
    }
  } else if (!B.sleeping && t > B.nextHop) {
    const target = keys.find(q => q.y > gY - 40 * k);
    jump(target ? target.x : B.x + (Math.random() - 0.5) * 30 * k, 0.55);
    B.nextHop = t + 1.8 + Math.random() * 2.5;
  }
  B.x = Math.max(16 * k, Math.min(W() - 16 * k, B.x));
  B.sqv += ((1 - B.sq) * 220 - B.sqv * 14) * dt; B.sq += B.sqv * dt;
  B.earV += ((0 - B.ear) * 160 - B.earV * 9) * dt; B.ear += B.earV * dt;

  for (const q of keys) {
    q.vy += 40 * k * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
    if (q.y > gY - 2 * k) { q.y = gY - 2 * k; q.vy = 0; q.vr = 0; }
    const hx = B.x + B.dir * 6 * k, hy = gY - B.y - 18 * k;
    if (Math.hypot(q.x - hx, q.y - hy) < 12 * k || (Math.abs(q.x - B.x) < 10 * k && q.y > gY - 6 * k && !B.airborne && B.y === 0)) {
      q.caught = true; caught++;
      burst(q.x / SX, q.y / SY, 14, ['✦', '*', '+', '·'], ['#ffd166', '#3ddc97', '#a78bfa', '#f472b6']);
      say(caught === 1 ? 'miam, une clé !' : `hopla ! ${caught} clés`, 1.2);
      B.nextHop = t + 0.4;
    }
  }
  for (let i = keys.length - 1; i >= 0; i--) if (keys[i].caught) keys.splice(i, 1);
  if (keys.length && !B.airborne && !B.sleeping && t > B.nextHop - 1.2) {
    const q = keys[0];
    if (q.y > gY - 45 * k) { jump(q.x, 0.7); B.nextHop = t + 1.2; }
  }

  for (const p of parts) { p.vy += 30 * dt; p.x += p.vx * dt * 0.5; p.y += p.vy * dt * 0.25; p.life -= dt; }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
  if (B.sleeping && Math.random() < dt * 1.2) parts.push({ x: (B.x + B.dir * 8 * scale()) / SX, y: (gY - 30 * scale()) / SY, vx: 4 * B.dir, vy: -6, life: 2.2, ch: Math.random() < 0.5 ? 'z' : 'Z', color: '#5ccfe6' });
}

function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function shade(x, y, r, light, dark) { const g = ctx.createRadialGradient(x - r * 0.45, y - r * 0.55, r * 0.1, x, y, r * 1.15); g.addColorStop(0, light); g.addColorStop(1, dark); return g; }

function drawKey(q) {
  const k = scale();
  ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
  ctx.lineWidth = 1.6 * k; ctx.strokeStyle = '#ffcf5a';
  ctx.beginPath(); ctx.arc(-4 * k, 0, 2.6 * k, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#ffcf5a'; ctx.fillRect(-1.4 * k, -0.8 * k, 8 * k, 1.6 * k);
  ctx.fillRect(4 * k, 0.4 * k, 1.4 * k, 2.2 * k); ctx.fillRect(6 * k, 0.4 * k, 1.2 * k, 1.6 * k);
  ctx.restore();
}

function drawBunny() {
  const k = scale(), gY = groundY();
  const sq = B.sq, sx = 1 / Math.sqrt(sq);
  // ground shadow shrinks as he rises
  const sh = Math.max(0.25, 1 - B.y / (40 * k));
  ellipse(B.x, gY + 0.6 * k, 14 * k * sh, 2.4 * k * sh, `rgba(0,0,0,${0.55 * sh})`);
  ctx.save();
  ctx.translate(B.x, gY - B.y);
  ctx.scale(B.dir * sx, sq);
  if (B.spin) { ctx.translate(0, -12 * k); ctx.rotate(B.spin); ctx.translate(0, 12 * k); }
  const fur = '#f4efe4', furDark = '#7d7466', pink = '#ff9fb8';
  const look = Math.max(-1, Math.min(1, (mouse.y * SY / cellH - (gY - B.y - 20 * k)) / (40 * k)));
  const perk = B.sleeping ? 0.9 : -0.12 + look * 0.1;
  // tail and back foot
  ellipse(-11 * k, -9 * k, 3.6 * k, 3.4 * k, shade(-11 * k, -9 * k, 3.6 * k, '#ffffff', '#b9b2a4'));
  ellipse(-5 * k, -1.8 * k, 6.5 * k, 2.3 * k, shade(-5 * k, -1.8 * k, 6.5 * k, fur, furDark));
  // body
  ellipse(0, -9.5 * k, 11.5 * k, 9 * k, shade(0, -9.5 * k, 11.5 * k, fur, furDark));
  // front paws
  ellipse(6.5 * k, -1.4 * k, 2.6 * k, 1.8 * k, shade(6.5 * k, -1.4 * k, 2.6 * k, fur, furDark));
  ellipse(9.5 * k, -1.2 * k, 2.4 * k, 1.7 * k, shade(9.5 * k, -1.2 * k, 2.4 * k, fur, furDark));
  // ears: pivot at the top of the head, twitch on keypress, droop when asleep
  [[3 * k, -0.35], [7.5 * k, 0.05]].forEach(([ex, base], i) => {
    ctx.save(); ctx.translate(ex, -25 * k); ctx.rotate(base + perk * (i ? 1 : 1.3) + B.ear * (i ? -1 : 1));
    ellipse(0, -8 * k, 2.8 * k, 9.5 * k, shade(0, -8 * k, 9.5 * k, fur, furDark));
    ellipse(0.2 * k, -7.5 * k, 1.3 * k, 7 * k, pink);
    ctx.restore();
  });
  // head
  ellipse(7 * k, -20 * k, 8.5 * k, 7.2 * k, shade(7 * k, -20 * k, 8.5 * k, fur, furDark));
  ellipse(11 * k, -17.5 * k, 2.4 * k, 1.5 * k, 'rgba(255,140,170,0.55)');
  // eyes follow the mouse, blink, close in sleep
  const blinking = B.sleeping || (t % 4.1) < 0.12;
  const px = 0.7 * k, py = look * 0.6 * k;
  [[5 * k, -21.5 * k, 1.9], [10.2 * k, -21.2 * k, 1.7]].forEach(([ex, ey, r]) => {
    if (blinking) { ctx.fillStyle = '#2a2622'; ctx.fillRect(ex - r * k, ey, 2 * r * k, 0.6 * k); return; }
    ellipse(ex, ey, r * k, r * 1.15 * k, '#fdfdfb');
    ellipse(ex + px, ey + py, r * 0.62 * k, r * 0.75 * k, '#15110e');
    ellipse(ex + px - 0.4 * k, ey + py - 0.5 * k, 0.45 * k, 0.45 * k, '#ffffff');
  });
  // nose wiggles
  ellipse(14.8 * k, -19 * k + Math.sin(t * 14) * 0.35 * k, 1.2 * k, 0.9 * k, pink);
  ctx.strokeStyle = 'rgba(230,225,215,0.8)'; ctx.lineWidth = 0.35 * k;
  for (const d of [-1, 0, 1]) { ctx.beginPath(); ctx.moveTo(14.5 * k, -18.6 * k); ctx.lineTo(20 * k, -18.6 * k + d * 1.8 * k + Math.sin(t * 14) * 0.2 * k); ctx.stroke(); }
  ctx.restore();
}

function drawWorld() {
  const k = scale(), gY = groundY();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W(), Hc());
  const g = ctx.createLinearGradient(0, gY, 0, Hc());
  g.addColorStop(0, '#2c4a36'); g.addColorStop(1, '#0a120d');
  ctx.fillStyle = g; ctx.fillRect(0, gY, W(), Hc() - gY);
  for (let x = 0; x < W(); x += 9 * k) {
    const h = (3 + ((x * 7919) % 5)) * k * (0.8 + 0.2 * Math.sin(t * 2 + x));
    ctx.strokeStyle = '#3f7a52'; ctx.lineWidth = 0.8 * k;
    ctx.beginPath(); ctx.moveTo(x, gY + 1); ctx.quadraticCurveTo(x + 1.5 * k, gY - h * 0.6, x + 2 * k + Math.sin(t * 1.5 + x) * k, gY - h); ctx.stroke();
  }
  // burrow on the right, where the keys end up
  ellipse(W() - 22 * k, gY + 0.5 * k, 9 * k, 4 * k, '#050807');
  keys.forEach(drawKey);
  drawBunny();
}

function toCells() {
  const data = ctx.getImageData(0, 0, cv.width, cv.height).data;
  const cells = new Array(ROWS * COLS);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    let R = 0, G = 0, Bl = 0;
    for (let yy = 0; yy < SY; yy++) for (let xx = 0; xx < SX; xx++) {
      const i = ((r * SY + yy) * cv.width + c * SX + xx) * 4;
      R += data[i]; G += data[i + 1]; Bl += data[i + 2];
    }
    const n = SX * SY; R /= n; G /= n; Bl /= n;
    const lum = (0.2126 * R + 0.7152 * G + 0.0722 * Bl) / 255;
    if (lum < 0.035) { cells[r * COLS + c] = null; continue; }
    const ch = RAMP[Math.min(RAMP.length - 1, Math.floor(Math.pow(lum, 0.8) * RAMP.length))];
    const m = Math.max(R, G, Bl, 1), f = Math.min(2.4, 235 / m);
    const q = v => Math.min(255, Math.round(v * f / 24) * 24);
    cells[r * COLS + c] = [ch, `rgb(${q(R)},${q(G)},${q(Bl)})`];
  }
  return cells;
}

function overlay(cells) {
  const put = (text, col, row, color) => [...text].forEach((ch, i) => {
    const c = Math.round(col) + i, r = Math.round(row);
    if (r >= 0 && r < ROWS && c >= 0 && c < COLS) cells[r * COLS + c] = [ch, color];
  });
  for (const p of parts) put(p.ch, p.x, p.y, p.color);
  const k = scale(), gY = groundY();
  if (bubble && t < bubble.until) {
    const col = (B.x + B.dir * 4 * k) / SX, row = (gY - B.y - 40 * k) / SY - 3;
    const w = [...bubble.text].length + 2;
    put('╭' + '─'.repeat(w) + '╮', col, row, '#d6e4dc');
    put('│ ' + bubble.text + ' │', col, row + 1, '#3ddc97');
    put('╰─┬' + '─'.repeat(w - 2) + '╯', col, row + 2, '#d6e4dc');
    put('╵', col + 2, row + 3, '#d6e4dc');
  }
  put('hopla', 2, 1, '#3ddc97');
  put(`· Lapla · clés rangées : ${caught}`, 8, 1, '#71857b');
  const hint = B.sleeping ? 'il dort… bouge la souris pour le réveiller' : 'clic : il saute là · espace : une clé tombe · tape « hopla » · immobile 8 s : il dort';
  put(hint, 2, ROWS - 2, '#4d5f56');
}

function toHtml(cells) {
  let out = '';
  for (let r = 0; r < ROWS; r++) {
    let cur = null, buf = '';
    for (let c = 0; c < COLS; c++) {
      const cell = cells[r * COLS + c];
      const ch = cell ? cell[0] : ' ', col = cell ? cell[1] : null;
      if (col !== cur) { if (buf) out += cur ? `<span style="color:${cur}">${esc(buf)}</span>` : buf; cur = col; buf = ''; }
      buf += ch;
    }
    out += (cur ? `<span style="color:${cur}">${esc(buf)}</span>` : buf) + '\n';
  }
  return out;
}
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; if (B.sleeping && t - B.lastActive > 8.5) wake(); B.lastActive = t; });
addEventListener('mousedown', e => { wake(); jump(e.clientX / cellW * SX, 1); say(['hopla !', 'hop !', 'youpi !'][Math.floor(Math.random() * 3)], 0.9); });
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) return;
  wake();
  if (e.key === ' ') {
    const k = scale();
    keys.push({ x: 20 * k + Math.random() * (W() - 60 * k), y: -10, vy: 0, rot: 0, vr: (Math.random() - 0.5) * 6 });
    e.preventDefault(); return;
  }
  B.ear = (Math.random() - 0.5) * 0.6; B.earV = 0;
  if (e.key.length === 1) {
    const k = scale();
    parts.push({ x: (B.x + B.dir * 6 * k) / SX, y: (groundY() - B.y - 32 * k) / SY, vx: (Math.random() - 0.5) * 10, vy: -14, life: 1.1, ch: e.key, color: '#a78bfa' });
    typed = (typed + e.key.toLowerCase()).slice(-5);
    if (typed === 'hopla') {
      jump(B.x, 1.35, true); say('HOPLA !!', 1.4);
      burst(B.x / SX, (groundY() - 20 * k) / SY, 40, ['✦', '*', '+', '•', '·'], ['#ffd166', '#3ddc97', '#a78bfa', '#f472b6', '#5ccfe6']);
      typed = '';
    }
  }
});

resize();
B.x = cv.width * 0.35; mouse.x = innerWidth / 2; mouse.y = innerHeight / 2;
let last = performance.now(), lastDraw = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  if (!started) { started = true; B.lastActive = t; say('salut, je suis Lapla', 2); }
  update(dt);
  if (now - lastDraw > 33) {
    drawWorld();
    const cells = toCells();
    overlay(cells);
    stage.innerHTML = toHtml(cells);
    lastDraw = now;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
